<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love calculator</title>
    <script src="love.js" defer></script>
    <link rel="stylesheet" href="love.css">
</head>
<body>
    <div class="container">
        <h1>Love Calculator</h1>
        <form id="loveForm">
            <label for="name1">Your Name:</label>
            <input type="text" id="name1" placeholder="Enter your name">
           
            <label for="name2">Partner's Name:</label>
            <input type="text" id="name2" placeholder="Enter your partner's name">
           
            <button type="submit" id="submitBtn">Calculate Love %</button>
        </form>
        <div id="result">Result will appear here</div>
        </div>
</body>
</html>
